# Consensus Landscape — nginx для k8s-образа.
# Симулятор (SPA) в /, документация (VitePress, статика) в /docs/.
server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Проба готовности/живости для k8s.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Документация VitePress: чистые URL (/docs/overview → overview.html).
    location /docs/ {
        try_files $uri $uri.html $uri/ =404;
    }

    # Хэшированные ассеты симулятора — кешируем надолго (имя меняется при пересборке).
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA-фолбэк симулятора: любой неизвестный путь → index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
